info:
  name: Login Admin (simpan token)
  type: http
  seq: 1
  tags:
    - setup

http:
  method: POST
  url: "{{base_url}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{admin_email}}",
        "password": "{{admin_password}}"
      }

runtime:
  variables:
    - name: admin_email
      value: superadmin@duniaprestasi.com
    - name: admin_password
      value: superadmin123
    - name: base_url
      value: https://dupres.baguswedanta.com/api/v1
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body) {
          const data = res.body.data || res.body;
          bru.setEnvVar("admin_access_token", data.access_token || "");
          bru.setEnvVar("admin_refresh_token", data.refresh_token || "");
          bru.setEnvVar("access_token", data.access_token || "");
          bru.setEnvVar("refresh_token", data.refresh_token || "");
          if (data.user && data.user.id) {
            bru.setEnvVar("admin_user_id", data.user.id);
            bru.setEnvVar("user_id", data.user.id);
          }
        }
    - type: tests
      code: |-
        test("login berhasil", function() {
          expect(res.status).to.equal(200);
          const data = res.body.data || res.body;
          expect(data.access_token).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: Login helper untuk mengisi environment `admin_access_token`, `admin_refresh_token`, dan `admin_user_id` secara otomatis.
