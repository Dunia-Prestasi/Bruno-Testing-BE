info:
  name: "Login Teacher (simpan token)"
  type: http
  seq: 2
  tags:
    - setup

http:
  method: POST
  url: "{{base_url}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{teacher_email}}",
        "password": "{{teacher_password}}"
      }
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body) {
          const data = res.body.data || res.body;
          bru.setEnvVar("teacher_access_token", data.access_token || "");
          bru.setEnvVar("teacher_refresh_token", data.refresh_token || "");
          bru.setEnvVar("access_token", data.access_token || "");
          bru.setEnvVar("refresh_token", data.refresh_token || "");
          if (data.user && data.user.id) {
            bru.setEnvVar("teacher_user_id", data.user.id);
            bru.setEnvVar("user_id", data.user.id);
          }
        }
    - type: tests
      code: |-
        test("login berhasil", function() {
          expect(res.status).to.equal(200);
          const data = res.body.data || res.body;
          expect(data.access_token).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Login helper untuk mengisi environment `teacher_access_token`, `teacher_refresh_token`, dan `teacher_user_id` secara otomatis.
