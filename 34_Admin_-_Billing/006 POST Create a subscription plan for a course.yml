info:
  name: "[POST] Create a subscription plan for a course"
  type: http
  seq: 6
  tags:
    - "34 Admin - Billing"

http:
  method: POST
  url: "{{base_url}}/courses/:id/subscription-plans"
  params:
    - name: "id"
      value: "{{course_id}}"
      type: path
      description: "Course ID"
  body:
    type: json
    data: |-
      {
        "duration_months": 6,
        "is_active": true,
        "name": "Data Dummy Bruno",
        "plan_type": "monthly",
        "price": 150000
      }
  auth:
    type: bearer
    token: "{{admin_access_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status >= 200 && res.status < 300 && res.body) {
          const data = res.body.data || res.body;
          if (data && data.id) bru.setEnvVar("subscription_plan_id", data.id);
        }
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([201, 400, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Create a subscription plan for a course

  Request siap pakai untuk pengujian manual API Dunia Prestasi.

  - Route: `POST /courses/{id}/subscription-plans`
  - Kelompok/role: `34 Admin - Billing`
  - Status sukses yang didokumentasikan: `201`
  - Bearer token: environment `{{admin_access_token}}`

  Parameter contoh sudah diisi; parameter query opsional dinonaktifkan agar mudah dipilih saat diperlukan.

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
