info:
  name: "[DELETE] Remove a subscription plan from a package"
  type: http
  seq: 28
  tags:
    - "34 Admin - Billing"

http:
  method: DELETE
  url: "{{base_url}}/packages/:id/subscription-plans/:planID"
  params:
    - name: "id"
      value: "{{resource_id}}"
      type: path
      description: "Package ID"
    - name: "planID"
      value: "{{subscription_plan_id}}"
      type: path
      description: "Subscription Plan ID"
  auth:
    type: bearer
    token: "{{admin_access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([200, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Remove a subscription plan from a package

  Detaches a subscription plan from a package's bundle.

  - Route: `DELETE /packages/{id}/subscription-plans/{planID}`
  - Kelompok/role: `34 Admin - Billing`
  - Status sukses yang didokumentasikan: `200`
  - Bearer token: environment `{{admin_access_token}}`

  Parameter contoh sudah diisi; parameter query opsional dinonaktifkan agar mudah dipilih saat diperlukan.

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
