info:
  name: "[PUT] Update a package"
  type: http
  seq: 25
  tags:
    - "34 Admin - Billing"

http:
  method: PUT
  url: "{{base_url}}/packages/:id"
  params:
    - name: "id"
      value: "{{resource_id}}"
      type: path
      description: "Package ID"
  body:
    type: json
    data: |-
      {
        "description": "Data dummy untuk pengujian API melalui Bruno",
        "grade_level_id": "{{question_grade_level_id}}",
        "is_active": true,
        "name": "Data Dummy Bruno",
        "price": 150000
      }
  auth:
    type: bearer
    token: "{{admin_access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([200, 400, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Update a package

  Updates a package's name, description, price, or active status.

  - Route: `PUT /packages/{id}`
  - Kelompok/role: `34 Admin - Billing`
  - Status sukses yang didokumentasikan: `200`
  - Bearer token: environment `{{admin_access_token}}`

  Parameter contoh sudah diisi; parameter query opsional dinonaktifkan agar mudah dipilih saat diperlukan.

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
