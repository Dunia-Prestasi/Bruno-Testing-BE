info:
  name: "[GET] List packages"
  type: http
  seq: 21
  tags:
    - "34 Admin - Billing"

http:
  method: GET
  url: "{{base_url}}/packages"
  params:
    - name: "active_only"
      value: "true"
      type: query
      description: "Filter to active packages only (default true)"
      disabled: true
    - name: "limit"
      value: "20"
      type: query
      description: "Page limit (default 20, max 100)"
      disabled: true
    - name: "offset"
      value: "0"
      type: query
      description: "Zero-based page number (default 0); multiplied internally by limit"
      disabled: true
  auth:
    type: bearer
    token: "{{admin_access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([200, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # List packages

  Lists sellable packages (bundles of subscription plans).

  - Route: `GET /packages`
  - Kelompok/role: `34 Admin - Billing`
  - Status sukses yang didokumentasikan: `200`
  - Bearer token: environment `{{admin_access_token}}`

  Parameter contoh sudah diisi; parameter query opsional dinonaktifkan agar mudah dipilih saat diperlukan.

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
