info:
  name: "[GET] List audit logs for a specific entity"
  type: http
  seq: 2
  tags:
    - "35 Admin - Audit Logs"

http:
  method: GET
  url: "{{base_url}}/audit-logs/entities/:schema/:table/:entityID"
  params:
    - name: "schema"
      value: "public"
      type: path
      description: "Database schema name"
    - name: "table"
      value: "users"
      type: path
      description: "Database table name"
    - name: "entityID"
      value: "{{entity_id}}"
      type: path
      description: "Entity ID"
    - name: "limit"
      value: "20"
      type: query
      description: "Page limit (default 20, max 100)"
      disabled: true
    - name: "offset"
      value: "0"
      type: query
      description: "Page offset (default 0)"
      disabled: true
  auth:
    type: bearer
    token: "{{admin_access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([200, 400, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # List audit logs for a specific entity

  Request siap pakai untuk pengujian manual API Dunia Prestasi.

  - Route: `GET /audit-logs/entities/{schema}/{table}/{entityID}`
  - Kelompok/role: `35 Admin - Audit Logs`
  - Status sukses yang didokumentasikan: `200`
  - Bearer token: environment `{{admin_access_token}}`

  Parameter contoh sudah diisi; parameter query opsional dinonaktifkan agar mudah dipilih saat diperlukan.

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
