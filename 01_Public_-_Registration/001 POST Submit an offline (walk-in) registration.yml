runtime:
  scripts:
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([201, 400, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Submit an offline (walk-in) registration

  Creates the student account, profile, and a pending cash payment immediately (concept identical to signup, but with the fuller data set an in-person admission requires). The account stays inactive and cannot log in until an admin confirms the cash payment via POST /payments/{id}/confirm.

  - Route: `POST /registrations/offline`
  - Kelompok/role: `01 Public - Registration`
  - Status sukses yang didokumentasikan: `201`

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
