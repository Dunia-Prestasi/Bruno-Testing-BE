info:
  name: "[GET] Dashboard learning analytics"
  type: http
  seq: 2
  tags:
    - "36 Admin - Dashboard and Reports"

http:
  method: GET
  url: "{{base_url}}/admin/dashboard/learning-analytics"
  params:
    - name: "start_date"
      value: "2026-07-01"
      type: query
      description: "Awal periode, YYYY-MM-DD WIB (default: 30 hari ke belakang)"
      disabled: true
    - name: "end_date"
      value: "2026-07-31"
      type: query
      description: "Akhir periode inklusif, YYYY-MM-DD WIB (default: hari ini)"
      disabled: true
    - name: "course_id"
      value: "{{course_id}}"
      type: query
      description: "Batasi seluruh angka ke satu kursus"
      disabled: true
  auth:
    type: bearer
    token: "{{admin_access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([200, 400, 401, 403, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Dashboard learning analytics

  Rata-rata kelulusan kuis dan ujian pada periode yang diminta, plus completion rate per kursus.

  - Route: `GET /admin/dashboard/learning-analytics`
  - Kelompok/role: `36 Admin - Dashboard and Reports`
  - Status sukses yang didokumentasikan: `200`
  - Bearer token: environment `{{admin_access_token}}` — butuh permission `reports:read` (teacher termasuk)

  Pass rate menghitung percobaan yang selesai di dalam periode. `completion_rate` bersifat kumulatif dan
    sengaja mengabaikan periode, karena menggambarkan sejauh mana kohort sudah berjalan secara keseluruhan.

  Parameter contoh sudah diisi; parameter query opsional dinonaktifkan agar mudah dipilih saat diperlukan.
