info:
  name: "[POST] Create a new user account (admin/teacher, etc.)"
  type: http
  seq: 3
  tags:
    - 30 Admin - Users and Registrations

http:
  method: POST
  url: "{{base_url}}/admin/users"
  body:
    type: json
    data: |-
      {
        "email": "{{teacher_email}}",
        "name": "Data Dummy Bruno10",
        "password": "{{teacher_password}}",
        "phone": "081234567890",
        "role": "teacher",
        "roles": [
          "teacher"
        ]
      }
  auth:
    type: bearer
    token: "{{admin_access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([201, 400, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Create a new user account (admin/teacher, etc.)

  Request siap pakai untuk pengujian manual API Dunia Prestasi.

  - Route: `POST /admin/users`
  - Kelompok/role: `30 Admin - Users and Registrations`
  - Status sukses yang didokumentasikan: `201`
  - Bearer token: environment `{{admin_access_token}}`

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
