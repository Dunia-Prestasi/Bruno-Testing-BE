info:
  name: "[POST] Create a new student"
  type: http
  seq: 11
  tags:
    - 30 Admin - Users and Registrations

http:
  method: POST
  url: "{{base_url}}/students"
  body:
    type: json
    data: |-
      {
        "avatar_url": "https://example.com/dummy-file.png",
        "email": "{{student_email}}",
        "name": "Data Dummy Bruno",
        "parent_profile": {
          "birth_order": 1,
          "father_name": "Made Santoso",
          "father_occupation": "Wiraswasta",
          "father_phone": "081234567891",
          "info_recipient": "father",
          "mother_name": "Komang Sari",
          "mother_occupation": "Guru",
          "mother_phone": "081234567892",
          "sibling_count": 1
        },
        "password": "{{dummy_password}}",
        "phone": "081234567890",
        "profile": {
          "address": "Jl. Pendidikan No. 1",
          "birth_date": "2026-07-17T00:00:00Z",
          "birth_place": "Denpasar",
          "country": "Indonesia",
          "district": "Denpasar Selatan",
          "education_level": "SMA",
          "gender": "male",
          "grade_level": "12",
          "nickname": "Budi",
          "parent_name": "Made Santoso",
          "parent_phone": "081234567891",
          "province": "Bali",
          "religion": "Hindu",
          "school_name": "SMA Negeri Contoh",
          "tutoring_type": "online"
        }
      }
  auth:
    type: bearer
    token: "{{admin_access_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status >= 200 && res.status < 300 && res.body) {
          const data = res.body.data || res.body;
          if (data && data.id) bru.setEnvVar("student_id", data.id);
        }
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([201, 400, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Create a new student

  Request siap pakai untuk pengujian manual API Dunia Prestasi.

  - Route: `POST /students`
  - Kelompok/role: `30 Admin - Users and Registrations`
  - Status sukses yang didokumentasikan: `201`
  - Bearer token: environment `{{admin_access_token}}`

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
