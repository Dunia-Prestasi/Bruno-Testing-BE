info:
  name: "[GET] List all users filter"
  type: http
  seq: 1
  tags:
    - 30 Admin - Users and Registrations

http:
  method: GET
  url: "{{base_url}}/admin/users?limit=4&offset=0"
  params:
    - name: limit
      value: "4"
      type: query
      description: Page limit (default 20, max 100)
    - name: offset
      value: "0"
      type: query
      description: Zero-based page number (default 0); multiplied internally by limit
    - name: search
      value: bruno
      type: query
      description: Search by name or email
      disabled: true
    - name: role
      value: students
      type: query
      description: Filter by role name
      disabled: true
    - name: is_active
      value: "true"
      type: query
      description: Filter by active status
      disabled: true
  auth:
    type: bearer
    token: "{{admin_access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([200, 400, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # List all users

  Lists all user accounts, filterable by search text, role, and active status.

  - Route: `GET /admin/users`
  - Kelompok/role: `30 Admin - Users and Registrations`
  - Status sukses yang didokumentasikan: `200`
  - Bearer token: environment `{{admin_access_token}}`

  Parameter contoh sudah diisi; parameter query opsional dinonaktifkan agar mudah dipilih saat diperlukan.

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
