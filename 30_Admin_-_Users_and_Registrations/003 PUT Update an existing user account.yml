info:
  name: "[PUT] Update an existing user account"
  type: http
  seq: 2
  tags:
    - 30 Admin - Users and Registrations

http:
  method: PUT
  url: "{{base_url}}/admin/users/:id"
  params:
    - name: id
      value: "{{user_id}}"
      type: path
      description: User ID
  body:
    type: json
    data: |-
      {
        "email": "{{new_user_email}}",
        "is_active": true,
        "name": "Data Dummy Bruno",
        "phone": "081234567890",
        "role": "teacher",
        "roles": [
          "teacher"
        ]
      }
  auth:
    type: bearer
    token: "{{admin_access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([200, 400, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Update an existing user account

  Updates user profile details, phone number, active status (soft delete/deactivation), and assigned role(s).

  - Route: `PUT /admin/users/{id}`
  - Kelompok/role: `30 Admin - Users and Registrations`
  - Status sukses yang didokumentasikan: `200`
  - Bearer token: environment `{{admin_access_token}}`

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
