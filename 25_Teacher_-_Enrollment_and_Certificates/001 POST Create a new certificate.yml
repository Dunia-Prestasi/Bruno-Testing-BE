info:
  name: "[POST] Create a new certificate"
  type: http
  seq: 1
  tags:
    - "25 Teacher - Enrollment and Certificates"

http:
  method: POST
  url: "{{base_url}}/certificates"
  body:
    type: json
    data: |-
      {
        "certificate_number": "CERT-BRUNO-001",
        "certificate_url": "https://example.com/dummy-file.png",
        "course_id": "{{course_id}}",
        "issued_at": "2026-07-17T00:00:00Z",
        "student_id": "{{student_id}}"
      }
  auth:
    type: bearer
    token: "{{teacher_access_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status >= 200 && res.status < 300 && res.body) {
          const data = res.body.data || res.body;
          if (data && data.id) bru.setEnvVar("certificate_id", data.id);
        }
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([201, 400, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Create a new certificate

  Request siap pakai untuk pengujian manual API Dunia Prestasi.

  - Route: `POST /certificates`
  - Kelompok/role: `25 Teacher - Enrollment and Certificates`
  - Status sukses yang didokumentasikan: `201`
  - Bearer token: environment `{{teacher_access_token}}`

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
