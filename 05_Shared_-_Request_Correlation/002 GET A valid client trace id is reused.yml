info:
  name: "[GET] A valid client trace id is reused"
  type: http
  seq: 2
  tags:
    - "05 Shared - Request Correlation"

http:
  method: GET
  url: "{{base_origin}}/health"
  headers:
    - name: X-Request-Id
      value: bruno-trace-0001
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        // Guard first: if the header never left the client, the assertions
        // below would pass or fail for the wrong reason.
        test("header X-Request-Id benar-benar terkirim", function() {
          const sent = req.getHeader("X-Request-Id") || req.getHeader("x-request-id");
          expect(
            sent,
            "request tidak mengirim X-Request-Id — periksa skema http.headers pada file ini"
          ).to.equal("bruno-trace-0001");
        });

        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("id dari client dipakai ulang apa adanya", function() {
          expect(res.getHeader("x-request-id")).to.equal("bruno-trace-0001");
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # A valid client trace id is reused

  - Route: `GET /health`
  - Kelompok/role: `05 Shared - Request Correlation`
  - Status sukses yang didokumentasikan: `200`

  Client boleh mengirim `X-Request-Id` sendiri agar satu trace bisa membentang
  melintasi beberapa service. Nilai dipakai ulang hanya bila panjangnya maksimal
  64 karakter dan seluruhnya berada dalam `A-Z a-z 0-9 - _`.

  `bruno-trace-0001` memenuhi syarat itu, sehingga respons harus mengembalikan
  nilai yang sama persis.
