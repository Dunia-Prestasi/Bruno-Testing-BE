            "question_group_id": "{{question_group_id}}",
            "question_text": "Jika turunan f(x) = 3x^2 - 4x + 1, berapakah f'(2)?",
            "question_type": "multiple_choice",
            "difficulty_level": "medium",
            "explanation": "f'(x) = 6x - 4. Maka f'(2) = 6(2) - 4 = 8",
            "score": 10,
            "answer_key_text": "8",
            "correct_numeric_value": 8,
            "metadata": { "source": "bruno", "item_index": 3 }
          },
          {
            "question_bank_id": "{{question_bank_id}}",
            "category_id": "{{question_category_id}}",
            "grade_level_id": "{{question_grade_level_id}}",
            "question_group_id": "{{question_group_id}}",
            "question_text": "Berapakah akar kuadrat dari 144?",
            "question_type": "multiple_choice",
            "difficulty_level": "easy",
            "explanation": "12 x 12 = 144.",
            "score": 5,
            "answer_key_text": "12",
            "correct_numeric_value": 12,
            "metadata": { "source": "bruno", "item_index": 4 }
          },
          {
            "question_bank_id": "{{question_bank_id}}",
            "category_id": "{{question_category_id}}",
            "grade_level_id": "{{question_grade_level_id}}",
            "question_group_id": "{{question_group_id}}",
            "question_text": "Berapakah hasil integral dari ∫ 2x dx dari 0 sampai 3?",
            "question_type": "multiple_choice",
            "difficulty_level": "hard",
            "explanation": "Integral dari 2x adalah x^2. Maka [x^2] dari 0 sampai 3 adalah 3^2 - 0^2 = 9.",
            "score": 15,
            "answer_key_text": "9",
            "correct_numeric_value": 9,
            "metadata": { "source": "bruno", "item_index": 5 }
