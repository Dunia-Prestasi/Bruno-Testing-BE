            "category_id": "{{question_category_id}}",
            "grade_level_id": "{{question_grade_level_id}}",
            "question_group_id": "{{question_group_id}}",
            "question_text": "Berapakah nilai x dari persamaan 2x + 6 = 14?",
            "question_type": "multiple_choice",
            "difficulty_level": "easy",
            "explanation": "2x = 14 - 6 = 8, sehingga x = 4",
            "score": 5,
            "answer_key_text": "4",
