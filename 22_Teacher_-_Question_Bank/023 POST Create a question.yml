            "grade_level_id": "{{question_grade_level_id}}",
            "question_group_id": "{{question_group_id}}",
            "question_text": "Berapakah keliling lingkaran dengan jari-jari 7 cm? (Gunakan π = 22/7)",
            "question_type": "multiple_choice",
            "difficulty_level": "medium",
            "explanation": "K = 2 * π * r = 2 * (22/7) * 7 = 44.",
            "score": 10,
            "answer_key_text": "44",
            "correct_numeric_value": 44,
            "metadata": { "source": "bruno", "item_index": 6 }
          },
          {
            "question_bank_id": "{{question_bank_id}}",
            "category_id": "{{question_category_id}}",
            "grade_level_id": "{{question_grade_level_id}}",
            "question_group_id": "{{question_group_id}}",
            "question_text": "Sebuah dadu dilempar sekali. Berapa peluang muncul mata dadu genap?",
            "question_type": "multiple_choice",
            "difficulty_level": "easy",
            "explanation": "Mata genap (2,4,6) = 3 dari 6 kemungkinan. Peluang = 3/6 = 0.5.",
            "score": 5,
            "answer_key_text": "0.5",
            "correct_numeric_value": 0.5,
            "metadata": { "source": "bruno", "item_index": 7 }
          },
          {
            "question_bank_id": "{{question_bank_id}}",
            "category_id": "{{question_category_id}}",
            "grade_level_id": "{{question_grade_level_id}}",
            "question_group_id": "{{question_group_id}}",
            "question_text": "Berapakah logaritma basis 10 dari 1000?",
            "question_type": "multiple_choice",
            "difficulty_level": "medium",
            "explanation": "10^3 = 1000, maka log10(1000) = 3.",
            "score": 10,
            "answer_key_text": "3",
            "correct_numeric_value": 3,
            "metadata": { "source": "bruno", "item_index": 8 }
          },
          {
            "question_bank_id": "{{question_bank_id}}",
            "category_id": "{{question_category_id}}",
            "grade_level_id": "{{question_grade_level_id}}",
            "question_group_id": "{{question_group_id}}",
            "question_text": "Jika matriks A = [[1, 2], [3, 4]], berapakah determinan matriks A?",
            "question_type": "multiple_choice",
            "difficulty_level": "hard",
            "explanation": "Det(A) = (1*4) - (2*3) = 4 - 6 = -2.",
            "score": 15,
            "answer_key_text": "-2",
            "correct_numeric_value": -2,
            "metadata": { "source": "bruno", "item_index": 9 }
          },
          {
            "question_bank_id": "{{question_bank_id}}",
            "category_id": "{{question_category_id}}",
            "grade_level_id": "{{question_grade_level_id}}",
            "question_group_id": "{{question_group_id}}",
            "question_text": "Berapakah jumlah dari suku pertama hingga ke-5 dari deret aritmatika 2, 4, 6, 8, ...?",
            "question_type": "multiple_choice",
            "difficulty_level": "medium",
            "explanation": "S5 = 5/2 * (2*2 + (5-1)*2) = 2.5 * (4 + 8) = 2.5 * 12 = 30.",
            "score": 10,
            "answer_key_text": "30",
            "correct_numeric_value": 30,
            "metadata": { "source": "bruno", "item_index": 10 }
          }
        ]
      }
  auth:
    type: bearer
    token: "{{teacher_access_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status >= 200 && res.status < 300 && res.body) {
          const data = res.body.data || res.body;
          if (data && data.id) bru.setEnvVar("question_id", data.id);
        }
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([201, 400, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Create a question

  Request siap pakai untuk pengujian manual API Dunia Prestasi.

  - Route: `POST /questions`
  - Kelompok/role: `22 Teacher - Question Bank`
  - Status sukses yang didokumentasikan: `201`
  - Bearer token: environment `{{teacher_access_token}}`

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
