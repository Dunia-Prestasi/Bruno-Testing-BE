info:
  name: "[POST] Add an option to a question"
  type: http
  seq: 27
  tags:
    - 22 Teacher - Question Bank

http:
  method: POST
  url: "{{base_url}}/questions/:id/options"
  params:
    - name: id
      value: "{{question_id}}"
      type: path
      description: Question ID
  body:
    type: json
    data: |
      {
        "options": [
          {
            "option_key": "A",
            "option_text": "2",
            "is_correct": false,
            "order_number": 1
          },
          {
            "option_key": "B",
            "option_text": "4",
            "is_correct": true,
            "order_number": 2
          },
          {
            "option_key": "C",
            "option_text": "6",
            "is_correct": false,
            "order_number": 3
          },
          {
            "option_key": "D",
            "option_text": "8",
            "is_correct": false,
            "order_number": 4
          }
        ]
      }
  auth:
    type: bearer
    token: "{{teacher_access_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status >= 200 && res.status < 300 && res.body) {
          const data = res.body.data || res.body;
          if (data && data.id) bru.setEnvVar("option_id", data.id);
        }
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([201, 400, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Add an option to a question

  Request siap pakai untuk pengujian manual API Dunia Prestasi.

  - Route: `POST /questions/{id}/options`
  - Kelompok/role: `22 Teacher - Question Bank`
  - Status sukses yang didokumentasikan: `201`
  - Bearer token: environment `{{teacher_access_token}}`

  Parameter contoh sudah diisi; parameter query opsional dinonaktifkan agar mudah dipilih saat diperlukan.

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
