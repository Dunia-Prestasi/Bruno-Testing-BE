info:
  name: "[GET] List questions"
  type: http
  seq: 22
  tags:
    - "22 Teacher - Question Bank"

http:
  method: GET
  url: "{{base_url}}/questions"
  params:
    - name: "question_bank_id"
      value: "{{question_bank_id}}"
      type: query
      description: "Filter by question bank ID"
      disabled: true
    - name: "category_id"
      value: "{{question_category_id}}"
      type: query
      description: "Filter by category ID"
      disabled: true
    - name: "grade_level_id"
      value: "{{question_grade_level_id}}"
      type: query
      description: "Filter by grade level ID"
      disabled: true
    - name: "question_group_id"
      value: "{{question_group_id}}"
      type: query
      description: "Filter by question group ID"
      disabled: true
    - name: "question_type"
      value: "multiple_choice"
      type: query
      description: "Filter by question type"
      disabled: true
    - name: "difficulty_level"
      value: "easy"
      type: query
      description: "Filter by difficulty level"
      disabled: true
    - name: "created_by"
      value: "{{teacher_user_id}}"
      type: query
      description: "Filter by creator user ID"
      disabled: true
    - name: "search"
      value: "bruno"
      type: query
      description: "Search question text"
      disabled: true
    - name: "limit"
      value: "20"
      type: query
      description: "Page limit (default 20, max 100)"
      disabled: true
    - name: "offset"
      value: "0"
      type: query
      description: "Zero-based page number (default 0); multiplied internally by limit"
      disabled: true
  auth:
    type: bearer
    token: "{{teacher_access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([200, 400, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # List questions

  Request siap pakai untuk pengujian manual API Dunia Prestasi.

  - Route: `GET /questions`
  - Kelompok/role: `22 Teacher - Question Bank`
  - Status sukses yang didokumentasikan: `200`
  - Bearer token: environment `{{teacher_access_token}}`

  Parameter contoh sudah diisi; parameter query opsional dinonaktifkan agar mudah dipilih saat diperlukan.

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
