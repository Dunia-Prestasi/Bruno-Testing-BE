info:
  name: "[GET] List exams"
  type: http
  seq: 3
  tags:
    - "23 Teacher - Assessments"

http:
  method: GET
  url: "{{base_url}}/exams"
  params:
    - name: "published_only"
      value: "true"
      type: query
      description: "Filter to published exams only (default true)"
      disabled: true
    - name: "limit"
      value: "20"
      type: query
      description: "Page limit (default 20, max 100)"
      disabled: true
    - name: "offset"
      value: "0"
      type: query
      description: "Zero-based page number (default 0); multiplied internally by limit"
      disabled: true
  auth:
    type: bearer
    token: "{{teacher_access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([200, 400, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # List exams

  Lists exams, published-only by default. Answer keys are hidden from callers without the learning-manage permission.

  - Route: `GET /exams`
  - Kelompok/role: `23 Teacher - Assessments`
  - Status sukses yang didokumentasikan: `200`
  - Bearer token: environment `{{teacher_access_token}}`

  Parameter contoh sudah diisi; parameter query opsional dinonaktifkan agar mudah dipilih saat diperlukan.

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
