info:
  name: "[POST] Create an exam"
  type: http
  seq: 4
  tags:
    - 23 Teacher - Assessments

http:
  method: POST
  url: "{{base_url}}/exams"
  body:
    type: json
    data: |-
      {
        "access_type": "subscription",
        "course_id": "{{course_id}}",
        "description": "Exam dummy untuk pengujian API melalui Bruno",
        "end_at": "2027-07-17T00:00:00Z",
        "exam_type": "tryout",
        "is_published": true,
        "lesson_id": "{{lesson_id}}",
        "max_attempts": 3,
        "module_id": "{{module_id}}",
        "passing_score": 75,
        "points_price": 100,
        "price": 150000,
        "shuffle_options": false,
        "shuffle_questions": false,
        "slug": "{{exam_slug}}",
        "start_at": "2026-07-17T00:00:00Z",
        "time_limit_minutes": 90,
        "title": "Konten Demo Bruno",
        "total_score": 100
      }
  auth:
    type: bearer
    token: "{{teacher_access_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status >= 200 && res.status < 300 && res.body) {
          const data = res.body.data || res.body;
          if (data && data.id) bru.setEnvVar("exam_id", data.id);
        }
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([201, 400, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Create an exam

  Request siap pakai untuk pengujian manual API Dunia Prestasi.

  - Route: `POST /exams`
  - Kelompok/role: `23 Teacher - Assessments`
  - Status sukses yang didokumentasikan: `201`
  - Bearer token: environment `{{teacher_access_token}}`

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
