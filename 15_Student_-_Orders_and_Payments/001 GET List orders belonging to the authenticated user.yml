info:
  name: "[GET] List orders belonging to the authenticated user"
  type: http
  seq: 1
  tags:
    - "15 Student - Orders and Payments"

http:
  method: GET
  url: "{{base_url}}/me/orders"
  params:
    - name: "limit"
      value: "20"
      type: query
      description: "Page limit (default 20, max 100)"
      disabled: true
    - name: "offset"
      value: "0"
      type: query
      description: "Page offset (default 0)"
      disabled: true
  auth:
    type: bearer
    token: "{{student_access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([200, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # List orders belonging to the authenticated user

  Request siap pakai untuk pengujian manual API Dunia Prestasi.

  - Route: `GET /me/orders`
  - Kelompok/role: `15 Student - Orders and Payments`
  - Status sukses yang didokumentasikan: `200`
  - Bearer token: environment `{{student_access_token}}`

  Parameter contoh sudah diisi; parameter query opsional dinonaktifkan agar mudah dipilih saat diperlukan.

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
