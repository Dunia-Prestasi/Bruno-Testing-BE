info:
  name: "[POST] Create a checkout (order) from subscription plans and/or exams"
  type: http
  seq: 2
  tags:
    - "15 Student - Orders and Payments"

http:
  method: POST
  url: "{{base_url}}/me/orders"
  body:
    type: json
    data: |-
      {
        "coupon_code": "contoh coupon code",
        "items": [
          {
            "exam_id": "{{exam_id}}",
            "subscription_plan_id": "{{subscription_plan_id}}"
          }
        ]
      }
  auth:
    type: bearer
    token: "{{student_access_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status >= 200 && res.status < 300 && res.body) {
          const data = res.body.data || res.body;
          if (data && data.id) bru.setEnvVar("order_id", data.id);
        }
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([201, 400, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Create a checkout (order) from subscription plans and/or exams

  Request siap pakai untuk pengujian manual API Dunia Prestasi.

  - Route: `POST /me/orders`
  - Kelompok/role: `15 Student - Orders and Payments`
  - Status sukses yang didokumentasikan: `201`
  - Bearer token: environment `{{student_access_token}}`

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
