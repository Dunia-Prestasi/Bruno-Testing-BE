info:
  name: "[GET] List students"
  type: http
  seq: 1
  tags:
    - "20 Teacher - Students and Progress"

http:
  method: GET
  url: "{{base_url}}/students"
  params:
    - name: "limit"
      value: "20"
      type: query
      description: "Page limit (default 10)"
      disabled: true
    - name: "offset"
      value: "0"
      type: query
      description: "Zero-based page number (default 0); multiplied internally by limit"
      disabled: true
    - name: "search"
      value: "bruno"
      type: query
      description: "Search term"
      disabled: true
    - name: "education_level"
      value: "SMA"
      type: query
      description: "Filter by education level"
      disabled: true
    - name: "grade_level"
      value: "12"
      type: query
      description: "Filter by grade level"
      disabled: true
    - name: "is_active"
      value: "true"
      type: query
      description: "Filter by active status"
      disabled: true
  auth:
    type: bearer
    token: "{{teacher_access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([200, 400, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # List students

  Request siap pakai untuk pengujian manual API Dunia Prestasi.

  - Route: `GET /students`
  - Kelompok/role: `20 Teacher - Students and Progress`
  - Status sukses yang didokumentasikan: `200`
  - Bearer token: environment `{{teacher_access_token}}`

  Parameter contoh sudah diisi; parameter query opsional dinonaktifkan agar mudah dipilih saat diperlukan.

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
