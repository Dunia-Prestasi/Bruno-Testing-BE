info:
  name: "[GET] Get a student's progress for a specific lesson"
  type: http
  seq: 10
  tags:
    - "20 Teacher - Students and Progress"

http:
  method: GET
  url: "{{base_url}}/students/:id/lesson-progress/:lessonID"
  params:
    - name: "id"
      value: "{{student_id}}"
      type: path
      description: "Student ID (omit or use 'me' on the /students/me variant for the authenticated student)"
    - name: "lessonID"
      value: "{{lesson_id}}"
      type: path
      description: "Lesson ID"
  auth:
    type: bearer
    token: "{{teacher_access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([200, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Get a student's progress for a specific lesson

  Retrieves a student's completion record for a specific lesson.

  - Route: `GET /students/{id}/lesson-progress/{lessonID}`
  - Kelompok/role: `20 Teacher - Students and Progress`
  - Status sukses yang didokumentasikan: `200`
  - Bearer token: environment `{{teacher_access_token}}`

  Parameter contoh sudah diisi; parameter query opsional dinonaktifkan agar mudah dipilih saat diperlukan.

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
