info:
  name: "[DELETE] Detach a module from a course"
  type: http
  seq: 33
  tags:
    - "21 Teacher - Courses and Content"

http:
  method: DELETE
  url: "{{base_url}}/courses/:id/modules/:moduleID"
  params:
    - name: "id"
      value: "{{course_id}}"
      type: path
      description: "Course ID"
    - name: "moduleID"
      value: "{{module_id}}"
      type: path
      description: "Module ID"
  auth:
    type: bearer
    token: "{{teacher_access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([200, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Detach a module from a course

  Removes a module from this course's curriculum without deleting the module (it may still be used by other courses).

  - Route: `DELETE /courses/{id}/modules/{moduleID}`
  - Kelompok/role: `21 Teacher - Courses and Content`
  - Status sukses yang didokumentasikan: `200`
  - Bearer token: environment `{{teacher_access_token}}`

  Parameter contoh sudah diisi; parameter query opsional dinonaktifkan agar mudah dipilih saat diperlukan.

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
