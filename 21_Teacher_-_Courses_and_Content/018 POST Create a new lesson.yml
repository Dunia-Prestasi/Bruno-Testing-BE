info:
  name: "[POST] Create a new lesson"
  type: http
  seq: 18
  tags:
    - 21 Teacher - Courses and Content

http:
  method: POST
  url: "{{base_url}}/lessons"
  body:
    type: json
    data: |-
      {
        "lessons": [
          {
            "title": "Pelajaran 1: Fungsi Kuadrat",
            "content_type": "text",
            "content_text": "Teks lengkap materi...",
            "duration_minutes": 45,
            "is_free_preview": false,
            "is_published": true
          },
          {
            "title": "Pelajaran 2: Video Aljabar",
            "content_type": "video",
            "video_url": "https://cdn.example.com/video.mp4",
            "duration_minutes": 30,
            "is_published": true
          }
        ]
      }
  auth:
    type: bearer
    token: "{{teacher_access_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status >= 200 && res.status < 300 && res.body) {
          const data = res.body.data || res.body;
          if (data && data.id) bru.setEnvVar("lesson_id", data.id);
        }
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([201, 400, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Create a new lesson

  Request siap pakai untuk pengujian manual API Dunia Prestasi.

  - Route: `POST /lessons`
  - Kelompok/role: `21 Teacher - Courses and Content`
  - Status sukses yang didokumentasikan: `201`
  - Bearer token: environment `{{teacher_access_token}}`

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
