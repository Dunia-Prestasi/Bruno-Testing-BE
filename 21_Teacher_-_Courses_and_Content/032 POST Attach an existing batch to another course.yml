info:
  name: "[POST] Attach an existing batch to another course"
  type: http
  seq: 32
  tags:
    - "21 Teacher - Courses and Content"

http:
  method: POST
  url: "{{base_url}}/batches/:batchID/courses/:courseID"
  params:
    - name: "batchID"
      value: "{{batch_id}}"
      type: path
      description: "Batch ID"
    - name: "courseID"
      value: "{{course_id}}"
      type: path
      description: "Course ID"
  auth:
    type: bearer
    token: "{{teacher_access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([201, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Attach an existing batch to another course

  Links an existing batch (cohort) to another course it also covers.

  - Route: `POST /batches/{batchID}/courses/{courseID}`
  - Kelompok/role: `21 Teacher - Courses and Content`
  - Status sukses yang didokumentasikan: `201`
  - Bearer token: environment `{{teacher_access_token}}`

  Parameter contoh sudah diisi; parameter query opsional dinonaktifkan agar mudah dipilih saat diperlukan.

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
