info:
  name: "[GET] List the authenticated student's certificates"
  type: http
  seq: 6
  tags:
    - "14 Student - Rewards and Certificates"

http:
  method: GET
  url: "{{base_url}}/students/me/certificates"
  auth:
    type: bearer
    token: "{{student_access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([200, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # List the authenticated student's certificates

  Request siap pakai untuk pengujian manual API Dunia Prestasi.

