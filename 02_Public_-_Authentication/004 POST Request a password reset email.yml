info:
  name: "[POST] Request a password reset email"
  type: http
  seq: 4
  tags:
    - "02 Public - Authentication"

http:
  method: POST
  url: "{{base_url}}/auth/forgot-password"
  body:
    type: json
    data: |-
      {
        "email": "{{login_email}}"
      }
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([202, 400, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Request a password reset email

  Request siap pakai untuk pengujian manual API Dunia Prestasi.

  - Route: `POST /auth/forgot-password`
  - Kelompok/role: `02 Public - Authentication`
  - Status sukses yang didokumentasikan: `202`

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
