info:
  name: "[GET] Start Google OAuth login flow"
  type: http
  seq: 6
  tags:
    - "02 Public - Authentication"

http:
  method: GET
  url: "{{base_url}}/auth/google/login"
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([302, 400, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: false
  maxRedirects: 5

docs: |-
  # Start Google OAuth login flow

  Request siap pakai untuk pengujian manual API Dunia Prestasi.

  - Route: `GET /auth/google/login`
  - Kelompok/role: `02 Public - Authentication`
  - Status sukses yang didokumentasikan: `302`

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
