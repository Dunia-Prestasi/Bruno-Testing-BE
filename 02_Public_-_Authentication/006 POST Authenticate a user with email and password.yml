info:
  name: "[POST] Authenticate a user with email and password"
  type: http
  seq: 6
  tags:
    - "02 Public - Authentication"

http:
  method: POST
  url: "{{base_url}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{login_email}}",
        "password": "{{login_password}}"
      }
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body) {
          const data = res.body.data || res.body;
          bru.setEnvVar("access_token", data.access_token || "");
          bru.setEnvVar("refresh_token", data.refresh_token || "");
          if (data.user && data.user.id) {
            bru.setEnvVar("user_id", data.user.id);
          }
        }
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([200, 400, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Authenticate a user with email and password

  Request siap pakai untuk pengujian manual API Dunia Prestasi.

  - Route: `POST /auth/login`
  - Kelompok/role: `02 Public - Authentication`
  - Status sukses yang didokumentasikan: `200`

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
