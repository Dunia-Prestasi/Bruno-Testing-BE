info:
  name: "[GET] Handle Google OAuth callback and complete login"
  type: http
  seq: 4
  tags:
    - "02 Public - Authentication"

http:
  method: GET
  url: "{{base_url}}/auth/google/callback"
  params:
    - name: "state"
      value: "replace-with-google-oauth-state"
      type: query
      description: "OAuth state token"
    - name: "code"
      value: "replace-with-google-oauth-code"
      type: query
      description: "OAuth authorization code"
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([200, 400, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Handle Google OAuth callback and complete login

  Request siap pakai untuk pengujian manual API Dunia Prestasi.

  - Route: `GET /auth/google/callback`
  - Kelompok/role: `02 Public - Authentication`
  - Status sukses yang didokumentasikan: `200`

  Parameter contoh sudah diisi; parameter query opsional dinonaktifkan agar mudah dipilih saat diperlukan.

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
