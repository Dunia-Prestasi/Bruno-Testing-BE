info:
  name: "[POST] Change the authenticated user's password"
  type: http
  seq: 1
  tags:
    - "03 Shared - Session"

http:
  method: POST
  url: "{{base_url}}/auth/change-password"
  body:
    type: json
    data: |-
      {
        "current_password": "{{login_password}}",
        "new_password": "{{dummy_password}}"
      }
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        // On success the account's real password is now new_password, and every
        // session (including this one) is revoked server-side. Keep login_password
        // in sync so the next "Authenticate a user" request still works, and clear
        // the now-invalid tokens so stale ones aren't reused elsewhere.
        if (res.status === 200) {
          bru.setEnvVar("login_password", "{{dummy_password}}");
          bru.setEnvVar("access_token", "");
          bru.setEnvVar("refresh_token", "");
        }
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([200, 400, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Change the authenticated user's password

  Request siap pakai untuk pengujian manual API Dunia Prestasi.

  - Route: `POST /auth/change-password`
  - Kelompok/role: `03 Shared - Session`
  - Status sukses yang didokumentasikan: `200`
  - Bearer token: environment `{{access_token}}`

  ⚠️ Endpoint ini sungguhan mengganti password akun yang sedang login, dan me-revoke SEMUA sesi aktif (termasuk `access_token`/`refresh_token` yang dipakai request ini) — bukan hanya simulasi. Setelah berhasil, kamu harus login ulang. Script `after-response` di sini otomatis update `login_password` ke `{{dummy_password}}` dan mengosongkan `access_token`/`refresh_token`, supaya request "Authenticate a user with email and password" berikutnya tetap jalan.

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
