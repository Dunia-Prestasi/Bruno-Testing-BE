info:
  name: "[GET] Protected health check"
  type: http
  seq: 4
  tags:
    - "03 Shared - Session"

http:
  method: GET
  url: "{{base_url}}/protected/health"
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("server memberikan respons HTTP", function() {
          expect(res.status).to.be.within(100, 599);
        });

        test("status sesuai kontrak atau middleware aplikasi", function() {
          expect([200, 401, 403, 404, 409, 422, 429, 500, 502, 503]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 30000
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Protected health check

  Request siap pakai untuk pengujian manual API Dunia Prestasi.

  - Route: `GET /protected/health`
  - Kelompok/role: `03 Shared - Session`
  - Status sukses yang didokumentasikan: `200`
  - Bearer token: environment `{{access_token}}`

  Body dan ID menggunakan data dummy/environment. Sesuaikan variabel ID setelah resource terkait dibuat.
